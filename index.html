<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <form action="#">
        <label for="playerName">First Player Name: <input   class="player1"  required type="text"></label>
        <label for="playerName">Second Player Name: <input required type="text" class="player2"></label>
        <button class="startBtn">Start Game</button>
    </form>
    <div class="container"><div class="one">X</div>
    <div class="two">O</div>
    <div class="three">X</div>
    <div class="four">O</div>
    <div class="five">X</div>
    <div class="six">O</div>
    <div class="seven">X</div>
    <div class="eight">O</div>
    <div class="nine">X</div></div>
    <p class="msg"></p>
    <script src="script.js"></script>
</body>
</html>
